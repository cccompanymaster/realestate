<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>매물 — HOMEPICK</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <span class="mark">H</span>
      <span class="name">HOME<em>PICK</em></span>
    </a>
    <nav class="nav">
      <a href="index.html">홈</a>
      <a href="listings.html?type=sale">매매</a>
      <a href="listings.html?type=rent">임대</a>
      <a href="listings.html?type=presale">분양</a>
      <a href="listings.html" class="active">전체 매물</a>
    </nav>
    <div class="header-cta">
      <a href="post.html" class="btn btn-primary">+ 매물 등록</a>
    </div>
  </div>
</header>

<main>

  <section class="page-head">
    <div class="container">
      <div class="crumb"><a href="index.html">HOMEPICK</a> / 전체 매물</div>
      <h1>지금 거래 가능한 <span class="serif">매물</span></h1>
      <p class="lead">총 <strong id="result-count" style="color:var(--ink);">0</strong>건의 매물이 등록되어 있습니다.</p>
    </div>
  </section>

  <section style="padding-top:0;">
    <div class="container">

      <form class="search-card" style="margin-bottom:28px;" onsubmit="event.preventDefault()">
        <div class="search-tabs">
          <button type="button" class="active">전체</button>
        </div>
        <input id="list-q" class="search-input" type="text" placeholder="지역·빌딩명으로 검색" />
        <button type="button" class="btn btn-primary">검색</button>
      </form>

      <div class="filters">
        <button class="chip" data-filter="all">전체</button>
        <button class="chip" data-filter="sale">매매</button>
        <button class="chip" data-filter="rent">임대</button>
        <button class="chip" data-filter="presale">분양</button>
      </div>

      <div class="listing-grid" id="listings-grid"></div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border:0;padding-top:0;">
      <span>© <span id="year">2026</span> HOMEPICK. All rights reserved.</span>
      <span>서울 강남구 테헤란로 152 · 1588-0000</span>
    </div>
  </div>
</footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
