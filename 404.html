<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>페이지를 찾을 수 없습니다 — HOMEPICK</title>
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
<style>
  .err-wrap {
    min-height: calc(100vh - 72px);
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .err {
    text-align: center; max-width: 520px;
  }
  .err .code {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(96px, 18vw, 180px);
    line-height: 1;
    color: var(--accent);
    letter-spacing: -0.04em;
    margin-bottom: 12px;
  }
  .err h1 {
    font-size: clamp(24px, 3.2vw, 32px);
    letter-spacing: -0.025em;
    font-weight: 700;
    margin-bottom: 12px;
    word-break: keep-all;
  }
  .err p {
    color: var(--ink-3);
    margin-bottom: 28px;
    word-break: keep-all;
  }
  .err .actions {
    display: inline-flex; gap: 10px; flex-wrap: wrap; justify-content: center;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <span class="mark">H</span>
      <span class="name">HOME<em>PICK</em></span>
    </a>
    <nav class="nav">
      <a href="index.html">홈</a>
      <a href="listings.html?type=sale">매매</a>
      <a href="listings.html?type=rent">임대</a>
      <a href="listings.html?type=presale">분양</a>
      <a href="listings.html">전체 매물</a>
    </nav>
    <div class="header-cta">
      <a href="#" class="btn btn-primary" data-consult>💬 상담 신청</a>
    </div>
  </div>
</header>

<main class="err-wrap">
  <div class="err">
    <div class="code">404</div>
    <h1>찾으시는 페이지를 발견하지 못했습니다.</h1>
    <p>주소가 변경되었거나 더 이상 존재하지 않는 매물일 수 있습니다.<br/>홈에서 다시 시작해 보세요.</p>
    <div class="actions">
      <a href="index.html" class="btn btn-primary btn-lg">홈으로 돌아가기</a>
      <a href="listings.html" class="btn btn-outline btn-lg">매물 목록 보기</a>
    </div>
  </div>
</main>

<!-- Consultation overlay -->
<div class="consult-overlay" id="consult-overlay" role="dialog" aria-modal="true" aria-labelledby="consult-title">
  <div class="consult-panel">
    <button class="consult-close" data-consult-close aria-label="닫기">✕</button>
    <h3 id="consult-title">무료 <span class="serif">1:1</span> 상담</h3>
    <p class="sub">편하신 채널로 문의해 주세요. 평균 10분 내 답변드립니다.</p>
    <div class="consult-options">
      <a href="#" class="consult-opt kakao">
        <div class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4C6.48 4 2 7.58 2 12c0 2.76 1.78 5.19 4.5 6.62L5.4 22l3.92-2.34c.86.15 1.76.23 2.68.23 5.52 0 10-3.58 10-8s-4.48-7.89-10-7.89z"/></svg></div>
        <div class="body"><strong>카카오톡 상담</strong><span>채널 추가 후 실시간 채팅</span></div>
        <span class="arrow">→</span>
      </a>
      <a href="tel:1588-0000" class="consult-opt tel">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/></svg></div>
        <div class="body"><strong>전화 상담</strong><span>1588-0000 · 평일 09–18시</span></div>
        <span class="arrow">→</span>
      </a>
      <a href="mailto:hello@homepick.kr" class="consult-opt mail">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg></div>
        <div class="body"><strong>이메일 문의</strong><span>hello@homepick.kr</span></div>
        <span class="arrow">→</span>
      </a>
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
